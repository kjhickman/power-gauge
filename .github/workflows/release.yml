name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to build (example: 0.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 11 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Derive release version
        id: version
        env:
          RAW_VERSION: ${{ inputs.version || github.ref_name }}
        shell: pwsh
        run: |
          $version = $env:RAW_VERSION.Trim().TrimStart('v', 'V')
          if (-not $version) { throw "Release version is empty." }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Build release assets
        shell: pwsh
        run: |
          ./scripts/Build-PowerGaugeWindowsRelease.ps1 -Version "${{ steps.version.outputs.value }}"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: PowerGauge-windows-x64-${{ steps.version.outputs.value }}
          path: |
            artifacts/release/PowerGauge-windows-x64-${{ steps.version.outputs.value }}.zip
            artifacts/release/PowerGauge-windows-x64-setup-${{ steps.version.outputs.value }}.exe

  publish-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 11 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x

      - name: Derive release version
        id: version
        env:
          RAW_VERSION: ${{ inputs.version || github.ref_name }}
        shell: pwsh
        run: |
          $version = $env:RAW_VERSION.Trim().TrimStart('v', 'V')
          if (-not $version) { throw "Release version is empty." }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Build release assets
        shell: pwsh
        run: |
          ./scripts/Build-PowerGaugeMacOsRelease.ps1 -Version "${{ steps.version.outputs.value }}"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: PowerGauge-macos-arm64-${{ steps.version.outputs.value }}
          path: |
            artifacts/release/PowerGauge-macos-arm64-${{ steps.version.outputs.value }}.zip
            artifacts/release/PowerGauge-macos-arm64-${{ steps.version.outputs.value }}.dmg

  publish-release:
    if: github.event_name == 'push'
    needs:
      - publish-windows
      - publish-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/release
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" artifacts/release/* --repo "$REPO" --clobber
          else
            PRERELEASE_ARGS=()
            if [[ "$TAG_NAME" == *-* ]]; then
              PRERELEASE_ARGS=(--prerelease)
            fi
            gh release create "$TAG_NAME" artifacts/release/* \
              --repo "$REPO" \
              --title "$TAG_NAME" \
              --generate-notes \
              "${PRERELEASE_ARGS[@]}"
          fi
